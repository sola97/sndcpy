name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read
    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Display structure of downloaded files
      run: ls -R

    - name: Remove previous artifacts for this workflow  # codex-artifact-retention-cleanup
      continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      uses: actions/github-script@v9
      with:
        github-token: ${{ github.token }}
        script: |
          const { owner, repo } = context.repo;
          const currentRun = await github.rest.actions.getWorkflowRun({
            owner,
            repo,
            run_id: context.runId
          });
          const artifacts = await github.paginate(
            github.rest.actions.listArtifactsForRepo,
            { owner, repo, per_page: 100 }
          );
          const previousArtifacts = artifacts.filter((artifact) =>
            !artifact.expired &&
            artifact.workflow_run &&
            String(artifact.workflow_run.workflow_id) === String(currentRun.data.workflow_id) &&
            String(artifact.workflow_run.id) !== String(context.runId)
          );
          for (const artifact of previousArtifacts) {
            await github.rest.actions.deleteArtifact({
              owner,
              repo,
              artifact_id: artifact.id
            });
            core.info(`Deleted previous artifact: ${artifact.name} (${artifact.id})`);
          }
          core.info(`Removed ${previousArtifacts.length} previous artifact(s)`);
    - name: Upload math result for job 1
      uses: actions/upload-artifact@v3
      with:
        name: sndcpy-release.apk
        path: /home/runner/work/sndcpy/sndcpy/app/build/outputs/apk/release/app-release.apk
        retention-days: 1
